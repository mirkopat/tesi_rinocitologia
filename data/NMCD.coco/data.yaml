# data.yaml - Configurazione del dataset NMCD per YOLO
# Questo file definisce il percorso delle immagini e le classi da riconoscere.
# Le classi sono state allineate con quelle del dataset NMCD, escludendo la classe
# generica "cells" (ID 0) che non è clinicamente rilevante.
# 
# Riferimenti:
# - Camporeale et al., "A nasal cytology dataset for object detection and deep learning", 2026
# - NMCD dataset, Università di Bari

# Percorso base del dataset (relativo alla posizione di questo file)
path: ../data/NMCD.coco

# Percorsi delle cartelle train, validation e test
train: train/images      # Immagini per l'addestramento
val: valid/images        # Immagini per la validazione
test: test/images        # Immagini per il test

# Numero di classi (escluse "cells", "artefatto" ed "emazia" per le metriche cliniche)
nc: 10

# Nomi delle classi (in ordine, corrispondenti alle categorie del dataset)
# Nota: "mast_cell" e "ciliated" sostituiscono "mast cell" e "epithelial ciliated"
# per evitare spazi nei nomi delle classi (requisito YOLO)
names:
  0: epithelial          # Cellule epiteliali (cellule della mucosa)
  1: neutrophil          # Neutrofili (infezioni batteriche)
  2: eosinophil          # Eosinofili (allergie, NARES)
  3: mast_cell           # Mastociti (NARMA, NARESMA)
  4: lymphocyte          # Linfociti (rari, patologici)
  5: goblet_cell         # Cellule caliciformi (produzione di muco)
  6: metaplastic         # Cellule metaplastiche (stress epiteliale)
  7: ciliated           # Cellule epiteliali ciliate (normali)
  8: erythrocyte        # Eritrociti (globuli rossi) - da escludere dalle metriche cliniche
  9: artifact           # Artefatti (polvere, sporco) - da escludere dalle metriche cliniche